[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tributary-research-engine"
version = "0.1.0"
description = "Evidence-grounded research over Tributary's authorized Query API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.11,<2"]

[project.scripts]
research-engine = "research_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["research_engine"]
strict = true
